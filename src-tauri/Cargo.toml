[package]
name = "reskin"
description = "Reskin — a floating box that turns any desktop icon into an editable canvas."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false
default-run = "reskin"

[lib]
name = "reskin_lib"
crate-type = ["rlib"]

[[bin]]
name = "reskin"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
reskin-core.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
tauri = { version = "=2.11.6", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-single-instance = "=2.4.5"
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-global-shortcut = "=2.3.2"

[target.'cfg(windows)'.dependencies]
webview2-com.workspace = true
windows-core.workspace = true
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
