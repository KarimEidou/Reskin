[workspace]
resolver = "3"
members = ["src-tauri", "crates/reskin-core"]

[workspace.package]
version = "1.0.1"
edition = "2024"
rust-version = "1.94"
license = "MIT"
authors = ["Karim Eidou"]
repository = "https://github.com/KarimEidou/Reskin"

[workspace.dependencies]
reskin-core = { path = "crates/reskin-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
ico = "0.5"
png = "0.17"
ts-rs = { version = "11.1", features = ["serde-compat", "no-serde-warnings"] }
windows = "0.61.3"
windows-core = "0.61"
webview2-com = "0.38"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 1
