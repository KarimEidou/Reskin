name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  gate:
    name: gate (versions and CHANGELOG match the tag, CI passed)
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v5
      - name: Versions match the tag
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            let table = "";
            let cargo;
            for (const line of readFileSync("Cargo.toml", "utf8").split(/\r?\n/)) {
              const header = /^\s*\[([^\]]+)\]/.exec(line);
              if (header) table = header[1];
              const version = /^\s*version\s*=\s*"([^"]+)"/.exec(line);
              if (table === "workspace.package" && version) cargo = version[1];
            }
            const found = {
              "package.json": JSON.parse(readFileSync("package.json", "utf8")).version,
              "src-tauri/tauri.conf.json": JSON.parse(readFileSync("src-tauri/tauri.conf.json", "utf8")).version,
              "Cargo.toml [workspace.package]": cargo,
            };
            const wrong = Object.entries(found).filter(([, v]) => v !== tag);
            for (const [file, v] of wrong) console.log(`::error::${file} has version ${v}, the tag says ${tag}`);
            if (wrong.length > 0) process.exit(1);
            console.log(`package.json, tauri.conf.json and Cargo.toml are all ${tag}`);
          '
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          # The release text is the tag's section of CHANGELOG.md (GitHub adds
          # its generated list of changes below it). Taken here, before the
          # wait for CI, so a tag the CHANGELOG doesn't describe fails at once.
          node --input-type=module -e '
            import { randomUUID } from "node:crypto";
            import { appendFileSync, readFileSync } from "node:fs";
            const tag = process.env.GITHUB_REF_NAME;
            const version = tag.replace(/^v/, "");
            const lines = readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
            const start = lines.findIndex((line) => line.startsWith(`## [${version}]`));
            if (start < 0) {
              console.log(`::error::CHANGELOG.md has no "## [${version}]" section`);
              process.exit(1);
            }
            // Up to the next version, the link references at the end, or EOF.
            const rest = lines.slice(start + 1);
            const end = rest.findIndex((line) => line.startsWith("## [") || /^\[[^\]]+\]:\s/.test(line));
            // A release text shows every line break, so the wrapped lines of a
            // paragraph or list item become one. Only plain text is joined:
            // code, headings, quotes, tables, HTML and hard breaks stay as
            // they are, and a line starting a list item or rule starts anew.
            const plain = (line) => line.trim() !== "" && !/^( {4}|\t)|^\s*(#|>|<|```|~~~)|\|/.test(line);
            const section = [];
            let fenced = false;
            for (const line of end < 0 ? rest : rest.slice(0, end)) {
              if (/^\s*(```|~~~)/.test(line)) fenced = !fenced;
              const prev = section.at(-1);
              const joins =
                !fenced && prev !== undefined && plain(prev) && !/( {2}|\\)$/.test(prev) &&
                plain(line) && !/^\s*(?:[-*+](?:\s|$)|\d+[.)](?:\s|$)|[=-]+\s*$|([-*_])(?:\s*\1){2,}\s*$)/.test(line);
              if (joins) section[section.length - 1] = `${prev.trimEnd()} ${line.trimStart()}`;
              else section.push(line);
            }
            const notes = section.join("\n").trim();
            if (!notes) {
              console.log(`::error::the "## [${version}]" section of CHANGELOG.md is empty`);
              process.exit(1);
            }
            const readme = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/blob/${tag}/README.md`;
            const unsigned =
              `Reskin is not code-signed yet: see [Windows protected your PC](${readme}#windows-protected-your-pc) ` +
              "for the SmartScreen warning, and check the downloads against `SHA256SUMS.txt`.";
            const eof = `EOF_${randomUUID()}`;
            appendFileSync(process.env.GITHUB_OUTPUT, `notes<<${eof}\n${notes}\n\n---\n\n${unsigned}\n${eof}\n`);
            console.log(`release notes: the ${version} section of CHANGELOG.md (${notes.split("\n").length} lines)`);
          '
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ci.yml runs the whole suite on every pushed commit (clippy, cargo
          # tests with the real shell integration, e2e, the installer
          # round-trip); only a commit it passed is released. A run still in
          # progress is waited for, and one about to start too: the branch
          # may have been pushed together with the tag.
          deadline=$((SECONDS + 90 * 60))
          appear_by=$((SECONDS + 5 * 60))
          while :; do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=100" \
              --jq '[.workflow_runs[] | {status, conclusion, url: .html_url}]')
            if jq -e 'any(.[]; .conclusion == "success")' <<<"$runs" >/dev/null; then
              echo "CI passed: $(jq -r 'map(select(.conclusion == "success"))[0].url' <<<"$runs")"
              exit 0
            fi
            total=$(jq 'length' <<<"$runs")
            running=$(jq 'map(select(.status != "completed")) | length' <<<"$runs")
            if [ "$running" -eq 0 ] && { [ "$total" -gt 0 ] || [ "$SECONDS" -ge "$appear_by" ]; }; then
              echo "::error::ci.yml has not passed on $GITHUB_SHA. Fix it (or push the commit to a branch so CI runs), then tag again."
              jq -r '.[] | "  \(.conclusion // .status): \(.url)"' <<<"$runs"
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::timed out waiting for ci.yml on $GITHUB_SHA"
              exit 1
            fi
            echo "waiting for ci.yml on $GITHUB_SHA ($running of $total run(s) still going)"
            sleep 30
          done

  release:
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Ensure WebView2 Runtime
        shell: pwsh
        run: ./scripts/ensure-webview2.ps1
      - name: Build bundles
        # `pnpm build` (the beforeBuildCommand) also writes
        # dist/THIRD_PARTY_NOTICES.txt, which the app embeds.
        run: pnpm tauri build
      - name: Smoke test
        shell: pwsh
        run: |
          Remove-Item "$env:TEMP\reskin.log" -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath 'target\release\reskin.exe' -ArgumentList '--smoke-test', '--capture-handoff' -PassThru -Wait
          Write-Host "exit code: $($p.ExitCode)"
          Get-Content "$env:TEMP\reskin.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "smoke test failed with exit code $($p.ExitCode)" }
          # The log must say it passed too, in case the exit code gets lost again
          # (Tauri drops the one the app asks for on Windows; see exit_with).
          if (-not (Get-Content "$env:TEMP\reskin.log" -ErrorAction SilentlyContinue | Select-String 'smoke: finished with exit code 0 ' -SimpleMatch -Quiet)) {
            throw 'smoke test did not report success'
          }
      - name: Stage release assets
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item "target\release\bundle\nsis\Reskin_${v}_x64-setup.exe" release-assets\
          Copy-Item "target\release\bundle\msi\Reskin_${v}_x64_en-US.msi" release-assets\
          Copy-Item 'target\release\reskin.exe' "release-assets\Reskin_${v}_x64_portable.exe"
          Copy-Item 'dist\THIRD_PARTY_NOTICES.txt' release-assets\
          Push-Location release-assets
          $lines = Get-ChildItem -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          [IO.File]::WriteAllLines("$PWD\SHA256SUMS.txt", $lines)
          Get-Content SHA256SUMS.txt
          # Re-verify every hash from the written file.
          foreach ($line in Get-Content SHA256SUMS.txt) {
            $hash, $name = $line -split '  ', 2
            $actual = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $hash) { throw "hash mismatch for $name" }
          }
          Pop-Location
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Reskin ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: ${{ needs.gate.outputs.notes }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.exe
            release-assets/*.msi
            release-assets/THIRD_PARTY_NOTICES.txt
            release-assets/SHA256SUMS.txt
