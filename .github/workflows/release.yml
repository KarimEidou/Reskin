name: Release

# Two ways to publish a release:
# * Actions > Release > Run workflow: releases the version in package.json
#   from the commit it runs on and creates its tag (vX.Y.Z) there.
# * Pushing a vX.Y.Z tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  gate:
    name: gate (versions and CHANGELOG match the tag, CI passed)
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v5
      - name: The tag to release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pushed tag names itself. Run from the Actions tab, the release is
          # the version in package.json, tagged on this commit when it is
          # published; a tag of that name on another commit stops it.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p 'require("./package.json").version')"
            if existing=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha 2>/dev/null) && [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::$tag is already released from $existing. Raise the version in package.json, tauri.conf.json and Cargo.toml, add its CHANGELOG section, then run the release again."
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "releasing $tag from $GITHUB_SHA"
      - name: Versions match the tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const tag = process.env.TAG.replace(/^v/, "");
            let table = "";
            let cargo;
            for (const line of readFileSync("Cargo.toml", "utf8").split(/\r?\n/)) {
              const header = /^\s*\[([^\]]+)\]/.exec(line);
              if (header) table = header[1];
              const version = /^\s*version\s*=\s*"([^"]+)"/.exec(line);
              if (table === "workspace.package" && version) cargo = version[1];
            }
            const found = {
              "package.json": JSON.parse(readFileSync("package.json", "utf8")).version,
              "src-tauri/tauri.conf.json": JSON.parse(readFileSync("src-tauri/tauri.conf.json", "utf8")).version,
              "Cargo.toml [workspace.package]": cargo,
            };
            const wrong = Object.entries(found).filter(([, v]) => v !== tag);
            for (const [file, v] of wrong) console.log(`::error::${file} has version ${v}, the tag says ${tag}`);
            if (wrong.length > 0) process.exit(1);
            console.log(`package.json, tauri.conf.json and Cargo.toml are all ${tag}`);
          '
      - name: Release notes (downloads, then the CHANGELOG section)
        id: notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Taken here, before the wait for CI, so a version the CHANGELOG
          # doesn't describe fails at once (scripts/release-notes.mjs).
          node scripts/release-notes.mjs "$TAG" --out "$RUNNER_TEMP/notes.md"
          eof="EOF_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          { echo "notes<<$eof"; cat "$RUNNER_TEMP/notes.md"; echo "$eof"; } >> "$GITHUB_OUTPUT"
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ci.yml runs the whole suite on every pushed commit (clippy, cargo
          # tests with the real shell integration, e2e, the installer
          # round-trip); only a commit it passed is released. A run still in
          # progress is waited for, and one about to start too: the branch
          # may have been pushed together with the tag.
          deadline=$((SECONDS + 90 * 60))
          appear_by=$((SECONDS + 5 * 60))
          while :; do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=100" \
              --jq '[.workflow_runs[] | {status, conclusion, url: .html_url}]')
            if jq -e 'any(.[]; .conclusion == "success")' <<<"$runs" >/dev/null; then
              echo "CI passed: $(jq -r 'map(select(.conclusion == "success"))[0].url' <<<"$runs")"
              exit 0
            fi
            total=$(jq 'length' <<<"$runs")
            running=$(jq 'map(select(.status != "completed")) | length' <<<"$runs")
            if [ "$running" -eq 0 ] && { [ "$total" -gt 0 ] || [ "$SECONDS" -ge "$appear_by" ]; }; then
              echo "::error::ci.yml has not passed on $GITHUB_SHA. Fix it (or push the commit to a branch so CI runs), then release again."
              jq -r '.[] | "  \(.conclusion // .status): \(.url)"' <<<"$runs"
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::timed out waiting for ci.yml on $GITHUB_SHA"
              exit 1
            fi
            echo "waiting for ci.yml on $GITHUB_SHA ($running of $total run(s) still going)"
            sleep 30
          done

  release:
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Ensure WebView2 Runtime
        shell: pwsh
        run: ./scripts/ensure-webview2.ps1
      - name: Build bundles
        # `pnpm build` (the beforeBuildCommand) also writes
        # dist/THIRD_PARTY_NOTICES.txt, which the app embeds.
        run: pnpm tauri build
      - name: Smoke test
        shell: pwsh
        run: |
          Remove-Item "$env:TEMP\reskin.log" -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath 'target\release\reskin.exe' -ArgumentList '--smoke-test', '--capture-handoff' -PassThru -Wait
          Write-Host "exit code: $($p.ExitCode)"
          Get-Content "$env:TEMP\reskin.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "smoke test failed with exit code $($p.ExitCode)" }
          # The log must say it passed too, in case the exit code gets lost again
          # (Tauri drops the one the app asks for on Windows; see exit_with).
          if (-not (Get-Content "$env:TEMP\reskin.log" -ErrorAction SilentlyContinue | Select-String 'smoke: finished with exit code 0 ' -SimpleMatch -Quiet)) {
            throw 'smoke test did not report success'
          }
      - name: Stage release assets
        shell: pwsh
        env:
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          # The same names in every release, so .../releases/latest/download/
          # Reskin-Setup.exe always gets the newest installer
          # (scripts/release-notes.mjs links them by these names).
          $v = $env:TAG.TrimStart('v')
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item "target\release\bundle\nsis\Reskin_${v}_x64-setup.exe" 'release-assets\Reskin-Setup.exe'
          Copy-Item "target\release\bundle\msi\Reskin_${v}_x64_en-US.msi" 'release-assets\Reskin.msi'
          Copy-Item 'target\release\reskin.exe' 'release-assets\Reskin-Portable.exe'
          Copy-Item 'dist\THIRD_PARTY_NOTICES.txt' release-assets\
          Push-Location release-assets
          $lines = Get-ChildItem -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          [IO.File]::WriteAllLines("$PWD\SHA256SUMS.txt", $lines)
          Get-Content SHA256SUMS.txt
          # Re-verify every hash from the written file.
          foreach ($line in Get-Content SHA256SUMS.txt) {
            $hash, $name = $line -split '  ', 2
            $actual = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $hash) { throw "hash mismatch for $name" }
          }
          Pop-Location
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Creates the tag on this commit when the release was started from
          # the Actions tab.
          tag_name: ${{ needs.gate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Reskin ${{ needs.gate.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: true
          body: ${{ needs.gate.outputs.notes }}
          fail_on_unmatched_files: true
          files: |
            release-assets/Reskin-Setup.exe
            release-assets/Reskin-Portable.exe
            release-assets/Reskin.msi
            release-assets/THIRD_PARTY_NOTICES.txt
            release-assets/SHA256SUMS.txt
