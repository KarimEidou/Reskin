  <path d="M720 214l22 58 58 22-58 22-22 58-22-58-58-22 58-22z" fill="#ffffff"/>
  <path d="M808 360l11 29 29 11-29 11-11 29-11-29-29-11 29-11z" fill="#ffffff" fill-opacity="0.85"/>
